{% extends 'base.html' %}
{% block title %}Proveedor{% endblock %}
{% block content %}
<h1>Proveedor #{{ proveedor.pk }}</h1>
<dl>
  <dt>Nombre</dt><dd>{{ proveedor.nombre }}</dd>
  <dt>Correo</dt><dd>{{ proveedor.correo }}</dd>
</dl>
<p><a href="{% url 'proveedores:lista' %}">Volver a la lista</a></p>
{% endblock %}
