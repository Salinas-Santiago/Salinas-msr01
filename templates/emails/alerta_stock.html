<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; background: #F5F7FA; color: #1A1A2E; padding: 20px; }
        .card { max-width: 600px; margin: 0 auto; background: #FFFFFF; border-radius: 8px; border-top: 5px solid #C0392B; padding: 25px; }
        .header { font-size: 18px; font-weight: bold; color: #C0392B; }
        .table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .table th { background: #0A2342; color: #FFFFFF; padding: 8px; text-align: left; }
        .table td { padding: 8px; border-bottom: 1px solid #E8F0FB; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">⚠️ Alerta: Stock Bajo</div>
        <p>Se detectaron {{ total_productos }} productos con stock menor a {{ umbral }} unidades:</p>
        <table class="table">
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Stock Actual</th>
                </tr>
            </thead>
            <tbody>
                {% for p in productos_bajos %}
                <tr>
                    <td>{{ p.nombre }}</td>
                    <td style="color:#C0392B; font-weight:bold;">{{ p.stock }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
