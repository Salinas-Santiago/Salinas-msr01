    <!-- ═══════════ TEMA "AURORA ERP" ═══════════ -->
    <style id="tema-chulo">
        /* ── Tokens extra ─────────────────────────────── */
        :root, [data-theme="light"] {
            --clr-bg: #EAF1FB;
            --glass: rgba(255,255,255,.74);
            --glass-border: rgba(255,255,255,.7);
        }
        [data-theme="dark"] {
            --clr-bg: #08111D;
            --glass: rgba(20,32,51,.72);
            --glass-border: rgba(107,174,232,.18);
        }
        :root {
            --grad-brand: linear-gradient(135deg, var(--clr-navy) 0%, var(--clr-royal) 100%);
            --grad-gold:  linear-gradient(135deg, var(--clr-gold) 0%, var(--clr-amber) 55%, var(--clr-gold) 100%);
        }

        /* ── Fondo: resplandores + cuadrícula de puntos ── */
        body {
            background:
                radial-gradient(900px 520px at 6% -6%,
                    color-mix(in srgb, var(--clr-sky) 30%, transparent), transparent 62%),
                radial-gradient(820px 520px at 96% 4%,
                    color-mix(in srgb, var(--clr-amber) 24%, transparent), transparent 62%),
                radial-gradient(900px 620px at 50% 112%,
                    color-mix(in srgb, var(--clr-royal) 22%, transparent), transparent 62%),
                var(--clr-bg);
            background-attachment: fixed;
        }
        body::before {
            content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background-image: radial-gradient(
                color-mix(in srgb, var(--clr-royal) 22%, transparent) 1px, transparent 1.3px);
            background-size: 24px 24px;
            -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 75%);
                    mask-image: linear-gradient(to bottom, #000 0%, transparent 75%);
        }
        ::selection { background: var(--clr-amber); color: var(--clr-navy); }

        /* ── Barra de navegación ─────────────────────── */
        .erp-navbar {
            position: sticky; top: 0; z-index: 1000;
            background: var(--grad-brand);
            border-bottom: 0;
            box-shadow: 0 6px 24px color-mix(in srgb, var(--clr-navy) 35%, transparent);
        }
        .erp-navbar::after {
            content: ""; position: absolute; left: 0; right: 0; bottom: -3px; height: 3px;
            background: linear-gradient(90deg, transparent, var(--clr-amber),
                        var(--clr-gold), var(--clr-amber), transparent);
        }
        .erp-brand { text-shadow: 0 0 18px color-mix(in srgb, var(--clr-amber) 55%, transparent); }
        .erp-nav-link { border-radius: 999px; }
        .erp-nav-link:hover, .erp-nav-link.active {
            background: rgba(255,255,255,.16);
            box-shadow: inset 0 -2px 0 var(--clr-amber);
        }
        .theme-toggle {
            background: var(--grad-gold);
            box-shadow: 0 0 14px color-mix(in srgb, var(--clr-amber) 60%, transparent);
        }

        /* ── Tarjetas de cristal ─────────────────────── */
        .erp-card {
            background: var(--glass);
            -webkit-backdrop-filter: blur(10px) saturate(140%);
                    backdrop-filter: blur(10px) saturate(140%);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            transition: transform .25s ease, box-shadow .25s ease;
            animation: erpFade .5s ease both;
        }
        .erp-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 34px color-mix(in srgb, var(--clr-navy) 22%, transparent);
        }
        .erp-card-header {
            background: var(--grad-brand);
            border-radius: 15px 15px 0 0;
            border-left: 5px solid var(--clr-amber);
        }

        /* ── Títulos con degradado ───────────────────── */
        .erp-page-title {
            border-bottom: 3px solid;
            border-image: linear-gradient(90deg, var(--clr-gold), transparent 70%) 1;
        }
        .erp-page-title h2 {
            background: linear-gradient(90deg, var(--clr-navy), var(--clr-royal) 55%, var(--clr-gold));
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; color: transparent;
        }
        [data-theme="dark"] .erp-page-title h2 {
            background: linear-gradient(90deg, var(--clr-sky), var(--clr-amber));
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; color: transparent;
        }

        /* ── Tablas ──────────────────────────────────── */
        .erp-table { border: 1px solid var(--glass-border); }
        .erp-table thead th {
            background: var(--grad-brand);
            border-bottom: 3px solid var(--clr-amber);
        }
        .erp-table tbody td {
            background: color-mix(in srgb, var(--clr-surface) 72%, transparent);
            transition: background .2s;
        }
        .erp-table tbody tr:nth-child(even) td {
            background: color-mix(in srgb, var(--clr-ice) 80%, transparent);
        }
        .erp-table tbody tr:hover td {
            background: color-mix(in srgb, var(--clr-sky) 18%, var(--clr-surface));
        }
        .erp-table td > a:not([class]) {
            color: var(--clr-royal); font-weight: 600; text-decoration: none;
        }
        .erp-table td > a:not([class]):hover { color: var(--clr-gold); text-decoration: underline; }
        [data-theme="dark"] .erp-table td > a:not([class]) { color: var(--clr-sky); }

        /* ── Botones ─────────────────────────────────── */
        .btn-erp-primary, .btn-erp-gold, .btn-erp-danger {
            transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
            box-shadow: 0 3px 10px color-mix(in srgb, var(--clr-navy) 25%, transparent);
        }
        .btn-erp-primary { background: var(--grad-brand); }
        .btn-erp-primary:hover {
            background: var(--grad-gold); color: var(--clr-navy);
            transform: translateY(-2px);
            box-shadow: 0 8px 18px color-mix(in srgb, var(--clr-gold) 40%, transparent);
        }
        .btn-erp-gold { background: var(--grad-gold); }
        .btn-erp-gold:hover {
            filter: brightness(1.08); transform: translateY(-2px);
            box-shadow: 0 8px 18px color-mix(in srgb, var(--clr-amber) 50%, transparent);
        }
        .btn-erp-danger { background: linear-gradient(135deg, #E74C3C, #C0392B); }
        .btn-erp-danger:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .btn-erp-primary:active, .btn-erp-gold:active, .btn-erp-danger:active {
            transform: translateY(0);
        }

        /* ── Formularios, badges y alertas ───────────── */
        .erp-input {
            background: color-mix(in srgb, var(--clr-surface) 85%, transparent);
            border-radius: 10px;
        }
        .erp-input:focus {
            border-color: var(--clr-amber);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--clr-amber) 25%, transparent);
        }
        .badge-erp-active, .badge-erp-inactive, .badge-erp-gold { backdrop-filter: blur(4px); }
        .erp-alert-danger, .erp-alert-info, .erp-alert-success {
            -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
            box-shadow: var(--shadow-sm);
        }

        /* ── Pie de página ───────────────────────────── */
        .erp-footer { background: var(--grad-brand); border-top: 0; position: relative; }
        .erp-footer::before {
            content: ""; position: absolute; left: 0; right: 0; top: -3px; height: 3px;
            background: linear-gradient(90deg, transparent, var(--clr-amber),
                        var(--clr-gold), var(--clr-amber), transparent);
        }

        /* ── Barra de scroll ─────────────────────────── */
        ::-webkit-scrollbar { width: 11px; height: 11px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--clr-royal), var(--clr-navy));
            border-radius: 10px; border: 2px solid transparent; background-clip: padding-box;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--clr-gold); background-clip: padding-box; }

        /* ── Animación de entrada ────────────────────── */
        @keyframes erpFade {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @media (prefers-reduced-motion: reduce) {
            .erp-card { animation: none; transition: none; }
            .btn-erp-primary, .btn-erp-gold, .btn-erp-danger { transition: none; }
        }
    </style>
